<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed Ghazal</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#f3f5f9;color:#1d2433;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;max-width:440px;width:100%;border-radius:16px;padding:26px 20px;
        box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
  h1{font-size:21px;margin:0 0 8px}
  p{color:#5b6475;line-height:1.7;margin:4px 0 18px;font-size:15px}
  .btn{display:block;width:100%;padding:16px;border-radius:12px;font-size:17px;
       font-weight:bold;text-decoration:none;margin-bottom:12px}
  .primary{background:#1a73e8;color:#fff}
  .second{background:#0f9d58;color:#fff}
  .ghost{background:#eef2f8;color:#1d2433;font-weight:normal;font-size:15px}
  .hint{font-size:14px;color:#5b6475;margin-top:16px;line-height:1.8;background:#fff8e1;
        border-radius:10px;padding:10px}
</style>
</head>
<body>
<div class="card">
  <h1>افتح الموقع في كروم</h1>
  <p>اضغط على الزرار الأزرق 👇</p>
  <a class="btn primary" id="b1" href="https://mohamedghazal.com">فتح في Chrome</a>
  <a class="btn second" id="b2" href="https://mohamedghazal.com">لو ما فتحش، جرّب ده</a>
  <a class="btn ghost" href="https://mohamedghazal.com">كمّل هنا عادي</a>
  <div class="hint">
    لو الأزرار ما فتحتش كروم: اضغط على <b>⋮</b> (التلات نقط) فوق
    واختار <b>Open in Chrome</b> أو <b>فتح في المتصفح</b>.
  </div>
</div>
<script>
(function () {
  var host = "mohamedghazal.com";
  var target = "https://" + host;
  var ua = navigator.userAgent || "";
  var b1 = document.getElementById("b1"), b2 = document.getElementById("b2");
  if (/android/i.test(ua)) {
    b1.href = "intent://" + host + "#Intent;scheme=https;action=android.intent.action.VIEW;" +
              "category=android.intent.category.BROWSABLE;package=com.android.chrome;" +
              "S.browser_fallback_url=" + encodeURIComponent(target) + ";end";
    b2.href = "googlechrome://navigate?url=" + encodeURIComponent(target);
    setTimeout(function(){ location.href = b1.href; }, 300);
  } else if (/iphone|ipad|ipod/i.test(ua)) {
    b1.href = "x-safari-" + target;
    b2.href = "googlechromes://" + host;
    setTimeout(function(){ location.href = b1.href; }, 300);
  } else {
    location.replace(target);
  }
})();
</script>
</body>
</html>
